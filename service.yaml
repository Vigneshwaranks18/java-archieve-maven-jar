apiVersion: v1
kind: Service
metadata:
  name: springboot-app-service
  labels:
    app: springboot-app
spec:
  type: NodePort # Use LoadBalancer if running on AWS EKS with a cloud load balancer
  selector:
    app: springboot-app
  ports:
    - protocol: TCP
      port: 80       # Port the service exposes
      targetPort: 8080 # Port your Spring Boot app runs on inside the containero

