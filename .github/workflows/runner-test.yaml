name: EC2 Runner Test#

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runner-test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner information
        run: |
          whoami
          hostname
          pwd

      - name: Check Docker
        run: |
          docker --version
          docker ps

      - name: Check Kubernetes
        run: |
          kubectl version --client
          kubectl get nodes

      - name: Check Minikube
        run: |
          minikube status
